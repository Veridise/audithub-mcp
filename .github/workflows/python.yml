name: Python Quality

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: "Quality / ${{ matrix.server }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server: [ah]

    defaults:
      run:
        working-directory: "src/${{ matrix.server }}"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098  # v7.3.1

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: "src/${{ matrix.server }}/.python-version"

      - name: Install dependencies
        working-directory: "."
        run: |
          uv sync --frozen

      - name: Supply chain audit
        run: uv run pip-audit

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Import sorting (ruff isort)
        run: uv run ruff check --select I src tests

      - name: Type check (mypy)
        run: uv run mypy

      - name: Unit tests
        run: uv run python -m pytest -m "not integration"

  integration:
    name: "Integration / ${{ matrix.server }}"
    runs-on: ubuntu-latest
    environment: "Configure CI/CD Testing"
    strategy:
      matrix:
        server: [ah]

    defaults:
      run:
        working-directory: "src/${{ matrix.server }}"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182  # v5.4.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version-file: "src/${{ matrix.server }}/.python-version"

      - name: Install dependencies
        working-directory: "."
        run: |
          uv sync --frozen

      - name: Integration tests
        run: uv run python -m pytest
        env:
          AUDITHUB_BASE_URL: ${{ secrets.AUDITHUB_BASE_URL }}
          AUDITHUB_OIDC_CONFIGURATION_URL: ${{ secrets.AUDITHUB_OIDC_CONFIGURATION_URL }}
          AUDITHUB_OIDC_CLIENT_ID: ${{ secrets.AUDITHUB_OIDC_CLIENT_ID }}
          AUDITHUB_OIDC_CLIENT_SECRET: ${{ secrets.AUDITHUB_OIDC_CLIENT_SECRET }}
          AH_ALLOWED_ORG_IDS: ${{ vars.AH_ALLOWED_ORG_IDS }}
          AH_ALLOWED_PROJECT_IDS: ${{ vars.AH_ALLOWED_PROJECT_IDS }}
