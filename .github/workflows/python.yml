name: Python Quality

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python:
    name: "${{ matrix.server }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server: [ah]

    defaults:
      run:
        working-directory: "src/${{ matrix.server }}"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182  # v5.4.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version-file: "src/${{ matrix.server }}/.python-version"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install "mcp>=1.0.0" ruff "mypy>=1.10.0"
          uv pip install --no-deps -e .

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Import sorting (ruff isort)
        run: ruff check --select I src tests

      - name: Type check (mypy)
        run: mypy

      - name: Tests
        run: python -m pytest
        env:
          AUDITHUB_BASE_URL: ${{ secrets.AUDITHUB_BASE_URL }}
          AUDITHUB_OIDC_CONFIGURATION_URL: ${{ secrets.AUDITHUB_OIDC_CONFIGURATION_URL }}
          AUDITHUB_OIDC_CLIENT_ID: ${{ secrets.AUDITHUB_OIDC_CLIENT_ID }}
          AUDITHUB_OIDC_CLIENT_SECRET: ${{ secrets.AUDITHUB_OIDC_CLIENT_SECRET }}
          AH_ALLOWED_ORG_IDS: "84"
          AH_ALLOWED_PROJECT_IDS: "275"
