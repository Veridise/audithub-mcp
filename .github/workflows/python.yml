name: Python Quality

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Supply chain audit
        if: ${{ !cancelled() }}
        run: uv run pip-audit --skip-editable

      - name: Lint (ruff)
        if: ${{ !cancelled() }}
        run: uv run ruff check src tests

      - name: Import sorting (ruff isort)
        if: ${{ !cancelled() }}
        run: uv run ruff check --select I src tests

      - name: Type check (mypy)
        if: ${{ !cancelled() }}
        run: uv run mypy

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: uv run python -m pytest -m "not integration"

  integration:
    name: Integration
    runs-on: ubuntu-latest
    environment: "Configure CI/CD Testing"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Integration tests
        run: uv run python -m pytest
        env:
          AUDITHUB_BASE_URL: ${{ secrets.AUDITHUB_BASE_URL }}
          AUDITHUB_OIDC_CONFIGURATION_URL: ${{ secrets.AUDITHUB_OIDC_CONFIGURATION_URL }}
          AUDITHUB_OIDC_CLIENT_ID: ${{ secrets.AUDITHUB_OIDC_CLIENT_ID }}
          AUDITHUB_OIDC_CLIENT_SECRET: ${{ secrets.AUDITHUB_OIDC_CLIENT_SECRET }}
          AH_ALLOWED_ORG_IDS: ${{ vars.AH_ALLOWED_ORG_IDS }}
          AH_ALLOWED_PROJECT_IDS: ${{ vars.AH_ALLOWED_PROJECT_IDS }}
