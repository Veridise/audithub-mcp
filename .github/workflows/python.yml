name: Python Quality

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Supply chain audit
        if: ${{ !cancelled() }}
        run: uv run pip-audit --skip-editable

      - name: Lint (ruff)
        if: ${{ !cancelled() }}
        run: uv run ruff check src tests

      - name: Import sorting (ruff isort)
        if: ${{ !cancelled() }}
        run: uv run ruff check --select I src tests

      - name: Type check (mypy)
        if: ${{ !cancelled() }}
        run: uv run mypy

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: uv run python -m pytest -m "not integration"

  integration:
    name: Integration
    runs-on: ubuntu-latest
    environment: "Configure CI/CD Testing"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Integration tests
        run: uv run python -m pytest
        env:
          AUDITHUB_BASE_URL: ${{ secrets.AUDITHUB_BASE_URL }}
          AUDITHUB_OIDC_CONFIGURATION_URL: ${{ secrets.AUDITHUB_OIDC_CONFIGURATION_URL }}
          AUDITHUB_OIDC_CLIENT_ID: ${{ secrets.AUDITHUB_OIDC_CLIENT_ID }}
          AUDITHUB_OIDC_CLIENT_SECRET: ${{ secrets.AUDITHUB_OIDC_CLIENT_SECRET }}
          AH_ALLOWED_ORG_IDS: ${{ vars.AH_ALLOWED_ORG_IDS }}
          AH_ALLOWED_PROJECT_IDS: ${{ vars.AH_ALLOWED_PROJECT_IDS }}
