name: Python Quality

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python:
    name: "${{ matrix.server }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server: [ah]

    defaults:
      run:
        working-directory: "src/${{ matrix.server }}"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098  # v7.3.1

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: "src/${{ matrix.server }}/.python-version"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install "mcp>=1.0.0" ruff "mypy>=1.10.0"
          uv pip install --no-deps -e .

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Import sorting (ruff isort)
        run: ruff check --select I src tests

      - name: Type check (mypy)
        run: mypy

      - name: Tests
        run: python -m pytest
