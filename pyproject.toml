[project]
name = "veridise-mcp-servers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["ah-mcp"]

[project.optional-dependencies]
dev = []

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "pip-audit>=2.7.0",
]

[tool.uv.sources]
ah-mcp = { workspace = true }

[tool.uv.workspace]
members = ["src/ah"]
