[project]
name = "ah-mcp"
version = "0.1.0"
description = "MCP server for AuditHub"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "audithub-sdk==1.0.2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "pip-audit>=2.7.0",
    "types-pyyaml>=6.0.12.20260518",
]

[project.scripts]
ah-mcp = "ah_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ah_mcp"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ah_mcp"]

[tool.mypy]
python_version = "3.12"
files = ["src/ah_mcp"]
strict = true
# audithub_sdk is generated and may not ship complete stubs.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["audithub_sdk", "audithub_sdk.*", "audithub_sdk_ext"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v"
markers = ["integration: marks tests as integration tests (require live API)"]

[tool.coverage.run]
source = ["src/ah_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
